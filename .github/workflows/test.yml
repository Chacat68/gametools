name: 测试套件

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: 安装系统依赖 (tkinter)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
        
    - name: 安装 Python 依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行所有测试
      run: |
        python test/run_all_tests.py
        
    - name: 上传测试报告
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          test_output/
          test_multi_lang/
          test_config_sync/
